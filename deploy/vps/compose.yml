name: community

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: community
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d community"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  app:
    image: ${COMMUNITY_IMAGE:-ghcr.io/villagehq/community:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://community:${POSTGRES_PASSWORD}@postgres:5432/community
      # Caddyfile overwrites this header on every request. Only Caddy can reach the app.
      CLIENT_IP_HEADER: x-real-ip
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/api/health").then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      COMMUNITY_DOMAIN: ${COMMUNITY_DOMAIN:?Set COMMUNITY_DOMAIN in .env}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - "${COMMUNITY_BIND_ADDRESS:+${COMMUNITY_BIND_ADDRESS}:}${COMMUNITY_HTTP_PORT:-80}:80"
      - "${COMMUNITY_BIND_ADDRESS:+${COMMUNITY_BIND_ADDRESS}:}${COMMUNITY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
